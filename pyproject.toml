[project]
name = "rsw-cli"
version = "0.1.0"
description = "RealSoft Workflow (RSW) — a spec-driven, multi-agent development CLI. Bootstraps a project with living docs (architecture constitution, data model, API registry, user stories) and installs /rsw-* skills for Claude Code, Cursor, and Codex."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.scripts]
rsw = "rsw_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rsw_cli"]

[tool.hatch.build.targets.wheel.force-include]
# Bundle the shared docs/scripts payload so `rsw init` works from an
# installed wheel (uv tool install / uvx) without needing the source repo
# checked out alongside it.
"templates" = "rsw_cli/core_pack/templates"
"scripts" = "rsw_cli/core_pack/scripts"
"skills" = "rsw_cli/core_pack/skills"
